# Rendered into {{ nginx_include_dir }}/00-abuse-protection.conf.
#
# nginx.conf includes that directory inside http {}, so everything here is
# http-level. The "00-" prefix matters: includes load in alphabetical order and
# a map variable must be defined before any server block that uses it.
#
# Added after a distributed crawl of The Events Calendar's paginated URLs
# saturated php-fpm (pm.max_children = 3 on a 1 CPU box) and took every site on
# the host down. In about 20 hours of logs: 73,581 matching requests from 59,697
# distinct IPs, 87% of which sent exactly one request. Mostly spoofed Chrome
# user agents, a self-referer of the bare site URL, and no CSS/JS/image fetches,
# so not browsers. Per-IP limits cannot stop that; matching the URL shape can.

limit_req_status 429;
limit_conn_status 429;

# Per-IP limits for requests that reach PHP. 5r/s with a burst is far above
# what a person browsing generates, so this only catches single-IP floods.
limit_req_zone $binary_remote_addr zone=php_per_ip:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# wp-login.php brute force. nginx does not limit a request whose zone key is
# the empty string, so this map restricts the zone to wp-login.php only.
map $uri $wp_login_key {
    default "";
    "~^/wp-login\.php$" $binary_remote_addr;
}
limit_req_zone $wp_login_key zone=wp_login:10m rate=6r/m;

# URL shapes only crawlers request. Each one is uncacheable and takes several
# seconds of PHP, and the URL space is effectively infinite. Do NOT block
# "ical=1" in general: real calendar subscribers (iOS, macOS, Google Calendar)
# fetch /events/?ical=1 regularly.
#   1. Deep Events Calendar list pagination. When this was added, pages 4+
#      drew 6222 requests versus 307 for pages 2-3.
#   2. Homepage or blog-style pagination carrying Events Calendar query args.
#      The calendar's real day/month views live under /events/.
map $request_uri $events_crawl {
    default 0;
    "~^/events/list/page/([4-9]|[1-9][0-9]+)/" 1;
    "~^/(page/[0-9]+/)?\?.*(eventDate|eventDisplay)=" 1;
}
