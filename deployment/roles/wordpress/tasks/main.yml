- group: name={{ user }} state=present

- ansible.builtin.user:
    name: "{{ user }}"
    group: "{{ user }}"
    groups:
      - "{{ user }}"
    append: yes

# No "group:" here. That sets the primary group, and this role runs once per
# site on a host where all the sites share the php user, so every deploy of a
# different site changed the php user's primary group to that site's group
# (it was eb4e-stage, then eb4e, then ...). php-fpm runs as php:php and reaches
# each site's files through the supplementary groups below, so it needs none of
# them as its primary group.
- ansible.builtin.user:
    name:  php
    groups:
      - "{{ user }}"
    append: yes

- file: path={{ directory }}/public
        state=directory
        mode=0755
        group={{ user }}
  become: yes
  become_user: "{{ user }}"

- name: "clone Wordpress version {{ wordpress_version }}"
  git: repo={{ wordpress_url }}
       dest={{ directory }}/wordpress
       version={{ wordpress_version }}
       update=yes
  become: yes
  become_user: "{{ user }}"

- name: Copy Wordpress files into the public folder
  command: 'rsync --archive --filter="- .git/" --filter="+ *" {{ directory }}/wordpress/ {{ directory }}/public'
  become: yes
  become_user: "{{ user }}"

- name: render wp-config.php into place
  template: src=wp-config.php
            dest={{ directory }}/public/wp-config.php
            owner={{ user }}
            group={{ user }}

- name: Install mysql python
  ansible.builtin.apt:
    name: python3-pymysql
    state: present

- name: create mysql user {{ database_user }}
  ansible.mysql.mysql_user:
    name: "{{ database_user }}"
    password: "{{ database_password }}"
    priv: "{{ database_name }}.*:ALL,GRANT"
    state: present
    host: "{{ database_host }}"
    login_user: root
    login_host: "{{ database_host }}"
    login_unix_socket: /run/mysqld/mysqld.sock

- name: ensure {{ database_name }} is present
  ansible.mysql.mysql_db:
    name: "{{ database_name }}"
    state: present
    login_host: "{{ database_host }}"
    login_password: "{{ database_password }}"
    login_user: "{{ database_user }}"

- file: path={{ directory }}/tmp
        state=directory
        mode=0755
        group={{ user }}
  become: yes
  become_user: "{{ user }}"

# 775 so that PHP can write to this directory
- file: path={{ directory }}/public/wp-uploads/tmp
        state=directory
        mode=0775
        group={{ user }}
  become: yes
  become_user: "{{ user }}"

- name: Get the akismet plugin
  ansible.builtin.get_url:
    url: "{{ akismet_url }}"
    dest: "{{ directory }}/tmp/akismet-{{ akismet_version }}.zip"
  register: result
  until: result is succeeded
  retries: 10
  delay: 10
  become: yes
  become_user: "{{ user }}"

- name: Install akismet
  # In --check mode the file this reads (downloaded or copied by an earlier task)
  # may not exist, because that task was only simulated. Ignore that failure in
  # check mode only: in a real run ansible_check_mode is false and a missing
  # source still fails the deploy.
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.unarchive:
    src={{ directory }}/tmp/akismet-{{ akismet_version }}.zip
    dest={{ directory }}/public/wp-content/plugins
    copy=no
  become: yes
  become_user: "{{ user }}"

- name: Get the progress bar plugin
  ansible.builtin.get_url:
    url: "{{ progress_bar_url }}"
    dest: "{{ directory }}/tmp/progress-bar-{{ progress_bar_version }}.zip"
  register: result
  until: result is succeeded
  retries: 10
  delay: 10
  become: yes
  become_user: "{{ user }}"

- name: Install the progress bar plugin
  # In --check mode the file this reads (downloaded or copied by an earlier task)
  # may not exist, because that task was only simulated. Ignore that failure in
  # check mode only: in a real run ansible_check_mode is false and a missing
  # source still fails the deploy.
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.unarchive:
    src={{ directory }}/tmp/progress-bar-{{ progress_bar_version }}.zip
    dest={{ directory }}/public/wp-content/plugins
    copy=no
  become: yes
  become_user: "{{ user }}"

- name: Get the wordpress importer plugin
  ansible.builtin.get_url:
    url:  "{{ wordpress_importer_url }}"
    dest: "{{ directory }}/tmp/wordpress-importer-{{ wordpress_importer_version }}.zip"
  register: result
  until: result is succeeded
  retries: 10
  delay: 10
  become: yes
  become_user: "{{ user }}"

- name: Unzip wordpress importer
  # In --check mode the file this reads (downloaded or copied by an earlier task)
  # may not exist, because that task was only simulated. Ignore that failure in
  # check mode only: in a real run ansible_check_mode is false and a missing
  # source still fails the deploy.
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.unarchive:
    src: "{{ directory }}/tmp/wordpress-importer-{{ wordpress_importer_version }}.zip"
    dest: "{{ directory }}/tmp"
    copy: no
  become: yes
  become_user: "{{ user }}"

- name: copy wordpress importer
  # In --check mode the file this reads (downloaded or copied by an earlier task)
  # may not exist, because that task was only simulated. Ignore that failure in
  # check mode only: in a real run ansible_check_mode is false and a missing
  # source still fails the deploy.
  ignore_errors: "{{ ansible_check_mode }}"
  ansible.builtin.copy:
    # "wordpress-importer-<version>" is the directory the tag archive unzips to
    # in the step above.
    #
    # the trailing slash means "don't copy to wordpress-importer/src"
    src: "{{ directory }}/tmp/wordpress-importer-{{ wordpress_importer_version }}/src/"
    dest: "{{ directory }}/public/wp-content/plugins/wordpress-importer"
    owner: "{{ user }}"
    group: "{{ user }}"
    remote_src: true
  become: yes
  become_user: "{{ user }}"

- name: download wordpress commandline tool
  ansible.builtin.get_url:
    url: "{{ wp_cli_url }}"
    dest: /home/php/bin/wp
    # With a checksum, get_url downloads only when the file on disk does not
    # match it, so this is a no-op once the pinned version is installed.
    checksum: "sha256:{{ wp_cli_sha256 }}"
    mode: 0755
  register: result
  until: result is succeeded
  retries: 10
  delay: 10
  become: yes
  become_user: php

- name: run wordpress database migration
  ansible.builtin.command: /home/php/bin/wp core update-db --path={{ directory }}/public
  become: yes
  become_user: "{{ user }}"

- name: render wordpress nginx template
  template: src=nginx.conf
            dest={{ nginx_include_dir }}/{{ domain }}.conf
            owner=nginx
            group=nginx
  notify: reload nginx
  tags: [crawl_defense]
