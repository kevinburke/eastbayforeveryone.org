---
- group: name=letsencrypt state=present

- name: Create the letsencrypt user
  ansible.builtin.user:
    name: letsencrypt
    groups:
      - letsencrypt
    append: yes

- name: Create remote tmp
  ansible.builtin.file:
    path: /home/letsencrypt/.ansible/tmp
    state: directory
    mode: 0755
    owner: letsencrypt
    group: letsencrypt

# state: present, not latest: a deploy should not upgrade packages as a side
# effect (unattended-upgrades does that). rsync is also used by the wordpress
# role.
- ansible.builtin.apt:
    name: [
      'rsync',
      'snapd'
    ]
    state: present

# you can't install up to date certbot with apt
- name: Install core/snapd
  community.general.snap:
    name:
      - core

# There used to be a "snap refresh core" task here. It is the only step in a
# deploy that has to reach the Snap Store (api.snapcraft.io), it failed whenever
# the store was unreachable and took the whole deploy down with it, and it
# refreshed the legacy "core" (core16) snap, which the certbot snap does not use
# (it is built on core24). snapd refreshes snaps by itself.

# you can't install up to date certbot with apt
- name: Install certbot
  community.general.snap:
    name: certbot
    classic: yes

# force: replaces a real file (from an old apt installation of certbot) with the
# symlink in one step. A separate "remove, then link" pair deleted and recreated
# the link on every deploy, so it always reported changes and, briefly, there
# was no certbot at all.
- name: symlink certbot command into place
  ansible.builtin.file:
    src: /snap/bin/certbot
    dest: /usr/bin/certbot
    state: link
    force: true

# There used to be a "synchronize certs/ -> /etc/letsencrypt/" task here, plus a
# recursive chown. certbot on the host owns /etc/letsencrypt (the certificates
# are issued and renewed there), and the local certs/ directory only holds a
# README. Pushing from a stale local copy would overwrite live certificates, so
# the task was removed.

- name: set up certificate renewal
  ansible.builtin.include_tasks:
    file: renewal.yml
