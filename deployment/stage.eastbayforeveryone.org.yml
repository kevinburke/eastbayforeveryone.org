---
- name: Install stage.eastbayforeveryone.org
  hosts: all

  # Wait up to 5 minutes for apt/dpkg to finish, instead of failing (or, as the
  # base role used to, killing the other process) when unattended-upgrades holds
  # the dpkg lock.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300

  roles:
    - role: common
    - role: swap
      swap_size: 2G
    - role: eastbayforeveryone.org
      tarsnap_enabled: false
      user: eb4e-stage
      directory: "/home/{{ user }}"
      # 6.9.1 is vulnerable to wp2shell (CVE-2026-63030, CVE-2026-60137), a
      # pre-auth takeover through the REST batch route. The accounts found on
      # this host fit that exploit (see the README, "wp2shell incident"). 6.9.5 is
      # the first fixed release; 6.9.11 is the newest 6.9.x. The wordpress role
      # clones this git tag and rsyncs it over public/, so the pin has to move
      # for the fix to stick.
      wordpress_version: '6.9.11'
      akismet_version: '5.6'
      pdf_embedder_version: '4.9.3'
      # https://wordpress.org/plugins/the-events-calendar/
      events_calendar_version: '6.15.16'
      progress_bar_version: '2.2.4'
      wordpress_ssl_enabled: true
      wordpress_debug: false
      domain: stage.eastbayforeveryone.org
      # stage2.eastbayforeveryone.org was removed from this list in November
      # 2026. Its DNS record is gone, so its certificate had been failing to
      # renew (and had expired in 2021). Remove a redirect domain here and
      # deploy BEFORE deleting its certbot lineage: nginx refuses to load the
      # config if a vhost still points at a certificate that does not exist.
      redirect_domains:
      - www.stage.eastbayforeveryone.org

# certbot certonly --non-interactive --webroot -w /home/eb4e-stage/public -d stage.eastbayforeveryone.org --renew-by-default --email kevin@burke.dev --text --agree-tos
