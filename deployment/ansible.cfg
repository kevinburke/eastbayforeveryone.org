[defaults]
host_key_checking = False
timeout = 30
# If a task fails after a handler was notified (for example, a config file was
# written and then a later task failed), still run the handlers. Otherwise the
# new config stays on disk but the service never reloads, and the next
# unrelated restart picks it up unexpectedly. nginx validates the config before
# it reloads (roles/nginx/handlers), so a bad config does not take the site down.
force_handlers = True

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=15 -o ServerAliveCountMax=3
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
