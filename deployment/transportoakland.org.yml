---
- name: Install transportoakland.org
  hosts: all

  # Wait up to 5 minutes for apt/dpkg to finish, instead of failing (or, as the
  # base role used to, killing the other process) when unattended-upgrades holds
  # the dpkg lock.
  module_defaults:
    ansible.builtin.apt:
      lock_timeout: 300

  roles:
    - role: common
    - role: swap
      swap_size: 2G
    - role: transportoakland.org
      tarsnap_enabled: false
      user: tpoakland
      directory: "/home/{{ user }}"
      # The 5.9 branch only gets security fixes now (5.9.20 is the newest). The
      # wordpress role clones this git tag and rsyncs it over public/, so a
      # "wp core update" done by hand is reverted by the next deploy unless this
      # is changed too. Moving to a newer branch (6.x) is a bigger change: test
      # it on a copy first, see the himalayas theme and PHP 8.5.
      wordpress_version: '5.9.20'
      akismet_version: '4.2.2'
      wordpress_ssl_enabled: true
      wordpress_debug: false
      domain: transportoakland.org
      redirect_domains:
        - www.transportoakland.org

